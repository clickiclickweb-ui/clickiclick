<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedad — Solara Inmobiliaria</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1B4332;--gold:#C9A227;--bg:#FAFAF5;--dark:#1a1a1a;--dim:#666;--t:all .3s cubic-bezier(.16,1,.3,1)}
body{font-family:'DM Sans',sans-serif;color:var(--dark);background:var(--bg);line-height:1.6}
h1,h2,h3,h4{font-family:'Playfair Display',serif;font-weight:700}
a{text-decoration:none;color:inherit}
nav{position:sticky;top:0;z-index:100;background:rgba(250,250,245,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(27,67,50,.08);padding:0 5vw;display:flex;align-items:center;justify-content:space-between;height:64px}
nav .logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--green)}
nav .logo span{color:var(--gold)}
.back{font-size:.85rem;color:var(--dim);transition:var(--t)}
.back:hover{color:var(--gold)}
.hero-img{width:100%;height:50vh;min-height:300px;max-height:500px;object-fit:cover}
.content{max-width:900px;margin:0 auto;padding:3rem 5vw}
.badges{display:flex;gap:.5rem;margin-bottom:1rem}
.badge{padding:.3rem .8rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge-country{background:var(--green);color:#fff}
.badge-tag{background:var(--gold);color:#fff}
h1{font-size:clamp(1.8rem,4vw,2.8rem);color:var(--green);margin-bottom:.5rem}
.price{font-size:1.5rem;font-weight:700;color:var(--gold);margin-bottom:.5rem}
.meta{display:flex;gap:1.5rem;color:var(--dim);font-size:.9rem;margin-bottom:2rem;flex-wrap:wrap}
.desc{margin-bottom:3rem}
.desc p{color:var(--dim);line-height:1.8;margin-bottom:1rem}
.features{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:3rem}
.feature{padding:1rem;background:#fff;border:1px solid rgba(27,67,50,.06);display:flex;align-items:center;gap:.75rem;font-size:.9rem}
.feature-icon{width:32px;height:32px;background:rgba(27,67,50,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--green);font-size:.85rem;font-weight:700}
.contact-card{background:var(--green);color:#fff;padding:2.5rem;margin-bottom:3rem}
.contact-card h3{color:#fff;margin-bottom:1rem;font-size:1.3rem}
.contact-card form input,.contact-card form textarea{width:100%;padding:.7rem 1rem;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;margin-bottom:.75rem;outline:none}
.contact-card form input::placeholder,.contact-card form textarea::placeholder{color:rgba(255,255,255,.35)}
.contact-card form input:focus,.contact-card form textarea:focus{border-color:var(--gold)}
.contact-card form textarea{min-height:80px;resize:vertical}
.contact-card form button{background:var(--gold);color:var(--green);border:none;padding:.75rem 2rem;font-weight:700;cursor:pointer;transition:var(--t);width:100%}
.contact-card form button:hover{background:#fff}
.agent{display:flex;align-items:center;gap:1rem;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.1)}
.agent-av{width:48px;height:48px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--green);font-size:1rem}
.agent-name{font-weight:700;font-size:.95rem}
.agent-role{font-size:.8rem;color:rgba(255,255,255,.6)}
footer{padding:2rem 5vw;background:#0f2b1e;color:rgba(255,255,255,.5);display:flex;justify-content:space-between;font-size:.8rem;flex-wrap:wrap;gap:1rem}
footer a{color:var(--gold)}
@media(max-width:768px){
  .features{grid-template-columns:1fr}
  .meta{flex-direction:column;gap:.5rem}
}
</style>
</head>
<body>
<nav>
  <a href="./" class="logo">Solara <span>Inmobiliaria</span></a>
  <a href="./" class="back">&larr; Volver al listado</a>
</nav>

<div id="heroImg"></div>
<div class="content">
  <div id="badges" class="badges"></div>
  <h1 id="propTitle"></h1>
  <div id="propPrice" class="price"></div>
  <div id="propMeta" class="meta"></div>
  <div id="propDesc" class="desc"></div>
  <h3 style="margin-bottom:1rem;color:var(--green)">Características</h3>
  <div id="propFeatures" class="features"></div>
  <div class="contact-card">
    <h3>¿Te interesa esta propiedad?</h3>
    <p style="color:rgba(255,255,255,.6);margin-bottom:1.5rem;font-size:.9rem">Déjanos tus datos y te contactamos en menos de 24 horas.</p>
    <form>
      <input type="text" placeholder="Nombre completo" required>
      <input type="tel" placeholder="Teléfono" required>
      <input type="email" placeholder="Email">
      <textarea id="msgArea" placeholder=""></textarea>
      <button type="submit">Solicitar información &rarr;</button>
    </form>
    <div class="agent">
      <div class="agent-av">ES</div>
      <div><div class="agent-name">Elena Solara</div><div class="agent-role">Directora &middot; +34 951 234 567</div></div>
    </div>
  </div>
</div>

<footer>
  <div>&copy; 2026 Solara Inmobiliaria</div>
  <div><a href="../">Diseñado por CLICKICLICK</a></div>
</footer>

<script>
var props={
  1:{title:'Villa Mediterránea',price:'485.000 \u20ac',loc:'Marbella, España',country:'España',beds:4,baths:3,m2:285,img:'photo-1613490493576-7fde63acd811',tag:'',
    desc:'<p>Espectacular villa de estilo mediterráneo ubicada en una de las zonas más exclusivas de Marbella. La propiedad se distribuye en dos plantas con amplios espacios de luz natural, jardín tropical privado y piscina infinity con vistas al mar.</p><p>Los acabados son de primera calidad: suelos de mármol travertino, carpintería de madera maciza y domótica integral. Cocina italiana totalmente equipada con isla central. Suite principal con vestidor y baño con vistas panorámicas.</p><p>Garaje privado para tres vehículos, sala de cine, bodega climatizada y zona de barbacoa exterior. A solo 5 minutos del centro de Marbella y 15 del aeropuerto de Málaga.</p>',
    features:['Piscina infinity','Jardín tropical','Garaje 3 plazas','Domótica integral','Bodega climatizada','Sala de cine','Terraza panorámica','Seguridad 24h']},
  2:{title:'Ático con vistas al mar',price:'325.000 \u20ac',loc:'Valencia, España',country:'España',beds:3,baths:2,m2:140,img:'photo-1600596542815-ffad4c1539a9',tag:'',
    desc:'<p>Luminoso ático en primera línea de playa con terraza de 40 m\u00B2 y vistas ininterrumpidas al Mediterráneo. Reformado integralmente en 2023 con materiales premium.</p><p>Tres dormitorios, dos baños completos, salón-comedor diáfano de 45 m\u00B2 y cocina americana equipada. Plaza de garaje y trastero incluidos. Comunidad con piscina y zonas ajardinadas.</p>',
    features:['Vistas al mar','Terraza 40 m\u00B2','Garaje incluido','Piscina comunitaria','Reformado 2023','Ascensor']},
  3:{title:'Residencia en Polanco',price:'$12.500.000 MXN',loc:'CDMX, Polanco, México',country:'México',beds:5,baths:4,m2:350,img:'photo-1600585154340-be6161a56a0c',tag:'Nuevo',
    desc:'<p>Residencia de lujo en la exclusiva colonia Polanco, una de las zonas más cotizadas de Ciudad de México. Construcción nueva con diseño arquitectónico contemporáneo firmado por despacho reconocido.</p><p>Cinco recámaras, cuatro baños completos, estudio, sala de televisión, comedor formal para 12 personas y cocina profesional. Jardín interior con fuente y terraza en azotea con vista a los volcanes.</p>',
    features:['Construcción nueva','Jardín interior','Terraza en azotea','Estacionamiento 4 autos','Cuarto de servicio','Seguridad privada','Elevador','Acabados de lujo']},
  4:{title:'Departamento Palermo Soho',price:'USD 128.000',loc:'Buenos Aires, Palermo, Argentina',country:'Argentina',beds:2,baths:1,m2:75,img:'photo-1512917774080-9991f1c4c750',tag:'',
    desc:'<p>Departamento de dos ambientes en el corazón de Palermo Soho, la zona más vibrante y cosmopolita de Buenos Aires. Reciclado a nuevo con diseño industrial: pisos de cemento alisado, ladrillo visto y carpintería de hierro.</p><p>Living-comedor luminoso con balcón a la calle arbolada. Cocina integrada con barra desayunadora. Dormitorio en suite con vestidor. Lavadero independiente. Expensas bajas.</p>',
    features:['Balcón a la calle','Reciclado a nuevo','Diseño industrial','Expensas bajas','Excelente ubicación','Luminoso']},
  5:{title:'Chalet con piscina privada',price:'595.000 \u20ac',loc:'Alicante, España',country:'España',beds:5,baths:3,m2:320,img:'photo-1600607687939-ce8a6c25118c',tag:'Rebajado',
    desc:'<p>Impresionante chalet independiente en urbanización cerrada con vigilancia 24 horas. Parcela de 800 m\u00B2 con piscina privada climatizada, zona de barbacoa y jardín con riego automático.</p><p>La vivienda se desarrolla en dos plantas: planta baja con salón de 60 m\u00B2, cocina office, dormitorio de invitados y baño. Planta alta con suite principal, tres dormitorios más y dos baños. Garaje para dos vehículos y amplio trastero.</p>',
    features:['Piscina climatizada','Parcela 800 m\u00B2','Urbanización cerrada','Garaje 2 plazas','Barbacoa exterior','Vigilancia 24h','Riego automático','Calefacción central']},
  6:{title:'Casa colonial restaurada',price:'$850M COP',loc:'Cartagena, Colombia',country:'Colombia',beds:4,baths:3,m2:220,img:'photo-1600585154340-be6161a56a0c',tag:'Favorito',
    desc:'<p>Excepcional casa colonial del siglo XVIII completamente restaurada en el centro amurallado de Cartagena de Indias. Declarada patrimonio arquitectónico, combina la magia de la arquitectura colonial con todas las comodidades contemporáneas.</p><p>Cuatro habitaciones con baño privado, patio interior con fuente, terraza en azotea con vista a la bahía, piscina plunge pool y sala de estar con techos a doble altura. Ideal como residencia principal o inversión turística de alto rendimiento.</p>',
    features:['Centro amurallado','Patio colonial','Terraza con vistas','Plunge pool','Restaurada integralmente','Patrimonio arquitectónico','Techos doble altura','Alta rentabilidad']},
  7:{title:'Departamento en Providencia',price:'185M CLP',loc:'Santiago, Providencia, Chile',country:'Chile',beds:3,baths:2,m2:95,img:'photo-1560448204-e02f11c3d0e2',tag:'',
    desc:'<p>Moderno departamento en uno de los edificios más nuevos de Providencia, a pasos del Metro y del Parque Balmaceda. Orientación norte con excelente luminosidad todo el año.</p><p>Tres dormitorios, dos baños, living-comedor amplio con salida a balcón, cocina equipada y logia. Edificio con piscina temperada, gimnasio, sala multiuso y conserjería 24 horas. Dos estacionamientos y bodega.</p>',
    features:['Cerca del Metro','Piscina temperada','Gimnasio','Conserjería 24h','2 estacionamientos','Bodega','Orientación norte','Edificio nuevo']},
  8:{title:'Piso reformado centro',price:'245.000 \u20ac',loc:'Madrid, Centro, España',country:'España',beds:3,baths:2,m2:110,img:'photo-1600596542815-ffad4c1539a9',tag:'Nuevo',
    desc:'<p>Piso completamente reformado en el barrio de las Letras, pleno centro de Madrid. Reforma integral de 2024 respetando elementos originales: techos con molduras, suelos de roble y balcones a la calle.</p><p>Tres dormitorios exteriores, dos baños modernos con ducha de obra, salón-comedor de 30 m\u00B2 con chimenea decorativa y cocina abierta. Finca clásica con portero físico. Sin garaje pero excelente conexión de transporte público.</p>',
    features:['Reformado 2024','Barrio de las Letras','Techos con molduras','Suelos de roble','Portero físico','Balcones a calle','Chimenea decorativa','Exterior']}
};
var id=new URLSearchParams(location.search).get('id')||'1';
var p=props[id]||props[1];
document.title=p.title+' — Solara Inmobiliaria';
document.getElementById('heroImg').innerHTML='<img style="width:100%;height:50vh;min-height:300px;max-height:500px;object-fit:cover" src="https://images.unsplash.com/'+p.img+'?w=1200&q=80" alt="'+p.title+'">';
var b='<span class="badge badge-country">'+p.country+'</span>';
if(p.tag)b+='<span class="badge badge-tag">'+p.tag+'</span>';
document.getElementById('badges').innerHTML=b;
document.getElementById('propTitle').textContent=p.title;
document.getElementById('propPrice').textContent=p.price;
document.getElementById('propMeta').innerHTML='<span>'+p.loc+'</span><span>'+p.beds+' habitaciones</span><span>'+p.baths+' baños</span><span>'+p.m2+' m\u00B2</span>';
document.getElementById('propDesc').innerHTML=p.desc;
document.getElementById('propFeatures').innerHTML=p.features.map(function(f){return '<div class="feature"><div class="feature-icon">+</div>'+f+'</div>'}).join('');
document.getElementById('msgArea').placeholder='Me gustaría obtener más información sobre '+p.title+'...';
</script>
</body>
</html>
