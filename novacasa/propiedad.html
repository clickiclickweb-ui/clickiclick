<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propiedad — NovaCasa</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#0f172a;--white:#ffffff;--blue:#2563eb;--gray:#64748b;--light:#f8fafc;--border:#e2e8f0}
body{font-family:'Inter',sans-serif;font-weight:300;color:var(--dark);background:var(--white);line-height:1.6}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:1.1}
a{text-decoration:none;color:inherit}
.container{max-width:1120px;margin:0 auto;padding:0 24px}
nav{position:fixed;top:0;left:0;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid var(--border)}
nav .container{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:-.5px}
.logo span{color:var(--blue)}
.nav-links{display:flex;align-items:center;gap:28px;font-size:.875rem;font-weight:400}
.nav-links a:hover{color:var(--blue)}
.nav-cta{background:var(--dark);color:var(--white);padding:8px 20px;border-radius:6px;font-size:.8rem;font-weight:500;transition:all .3s cubic-bezier(.16,1,.3,1)}
.nav-cta:hover{background:var(--blue)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--gray);margin-bottom:24px;padding-top:100px;transition:all .3s cubic-bezier(.16,1,.3,1)}
.back:hover{color:var(--blue)}
.prop-hero{height:400px;border-radius:16px;margin-bottom:32px;position:relative;overflow:hidden}
.prop-badges{position:absolute;top:20px;left:20px;display:flex;gap:8px}
.badge{padding:6px 14px;border-radius:6px;font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.badge-new{background:var(--blue);color:var(--white)}
.badge-sale{background:#dc2626;color:var(--white)}
.prop-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:32px}
.prop-header h1{font-size:clamp(1.6rem,3vw,2.4rem);letter-spacing:-1px}
.prop-loc{font-size:.9rem;color:var(--gray);margin-top:6px}
.prop-price{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;color:var(--blue)}
.prop-meta{display:flex;gap:24px;padding:24px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:40px}
.prop-meta-item{text-align:center}
.prop-meta-item .val{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700}
.prop-meta-item .lbl{font-size:.75rem;color:var(--gray);text-transform:uppercase;letter-spacing:1px}
.prop-grid{display:grid;grid-template-columns:2fr 1fr;gap:40px}
.prop-desc p{color:var(--gray);margin-bottom:16px}
.prop-desc h2{font-size:1.2rem;margin-bottom:16px;letter-spacing:-.3px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.feature{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--light);border-radius:8px;font-size:.85rem}
.feature svg{width:18px;height:18px;fill:var(--blue);flex-shrink:0}
.floor-plan{margin-top:40px;height:200px;background:var(--light);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:.85rem;border:1px dashed var(--border)}
.sidebar{position:sticky;top:88px}
.contact-card{background:var(--light);border-radius:16px;padding:32px;margin-bottom:24px}
.contact-card h3{font-size:1.1rem;margin-bottom:20px;letter-spacing:-.3px}
.contact-card input,.contact-card textarea{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:.85rem;outline:none;margin-bottom:12px;background:var(--white)}
.contact-card input:focus,.contact-card textarea:focus{border-color:var(--blue)}
.contact-card textarea{resize:vertical;min-height:80px}
.btn{display:inline-block;padding:14px 32px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:500;font-size:.9rem;transition:all .3s cubic-bezier(.16,1,.3,1);cursor:pointer;border:none;width:100%;text-align:center}
.btn-blue{background:var(--blue);color:var(--white)}
.btn-blue:hover{background:var(--dark)}
.agent{display:flex;align-items:center;gap:16px;padding:24px;background:var(--light);border-radius:16px}
.agent-avatar{width:52px;height:52px;border-radius:50%;background:var(--dark);color:var(--white);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.9rem;flex-shrink:0}
.agent-info .name{font-weight:500;font-size:.9rem}
.agent-info .role{font-size:.8rem;color:var(--gray)}
footer{padding:40px 0;border-top:1px solid var(--border);text-align:center;font-size:.8rem;color:var(--gray);margin-top:80px}
footer a{color:var(--blue);font-weight:500}
footer a:hover{text-decoration:underline}
@media(max-width:768px){
  .nav-links{display:none}
  .prop-grid{grid-template-columns:1fr}
  .prop-hero{height:260px}
  .prop-meta{flex-wrap:wrap;gap:16px}
}
.reveal{opacity:0;transform:translateY(20px);transition:all .6s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="index.html" class="logo">Nova<span>Casa</span></a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="vender.html">Vender</a>
      <a class="nav-cta" href="tel:+34900000000">+34 900 000 000</a>
    </div>
  </div>
</nav>

<div class="container">
  <a href="index.html" class="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Volver al listado</a>

  <div class="prop-hero" id="propHero"></div>

  <div class="prop-header reveal">
    <div>
      <h1 id="propTitle"></h1>
      <p class="prop-loc" id="propLoc"></p>
    </div>
    <div class="prop-price" id="propPrice"></div>
  </div>

  <div class="prop-meta reveal" id="propMeta"></div>

  <div class="prop-grid">
    <div class="prop-desc reveal" id="propDesc"></div>
    <div class="sidebar">
      <div class="contact-card reveal">
        <h3>Te interesa esta propiedad?</h3>
        <form onsubmit="return false">
          <input type="text" placeholder="Nombre completo" required>
          <input type="tel" placeholder="Telefono" required>
          <input type="email" placeholder="Email" required>
          <textarea placeholder="Me interesa esta propiedad..."></textarea>
          <button class="btn btn-blue" type="submit">Solicitar informacion</button>
        </form>
      </div>
      <div class="agent reveal" id="propAgent"></div>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <p>NovaCasa &mdash; Vivienda urbana contemporanea</p>
    <p style="margin-top:8px">Diseñado por <a href="../">CLICKICLICK</a></p>
  </div>
</footer>

<script>
const properties={
  1:{title:"Loft en Polanco",loc:"CDMX, Mexico",price:"$4,850,000 MXN",beds:2,baths:1,m2:75,tag:"nuevo",
    gradient:"linear-gradient(135deg,#1e3a5f,#2563eb)",agent:"Alejandra Rios",agentInit:"AR",
    desc1:"Espectacular loft de diseno contemporaneo ubicado en el corazon de Polanco, una de las zonas mas exclusivas de la Ciudad de Mexico. Cuenta con acabados de primera calidad, pisos de concreto pulido, cocina integral con electrodomesticos de acero inoxidable y amplios ventanales que inundan el espacio de luz natural.",
    desc2:"El edificio ofrece amenidades de primer nivel: gimnasio equipado, terraza comun con vista a la ciudad, lobby con concierge las 24 horas y estacionamiento techado. Ubicacion privilegiada a pasos de restaurantes, galerias y el Bosque de Chapultepec.",
    features:["Pisos de concreto pulido","Cocina integral equipada","Ventanales piso a techo","Estacionamiento techado","Gimnasio y terraza comun","Concierge 24 horas","Aire acondicionado central","Bodega privada"]},
  2:{title:"Apartamento Providencia",loc:"Santiago, Chile",price:"185.000.000 CLP",beds:3,baths:2,m2:95,tag:"",
    gradient:"linear-gradient(135deg,#334155,#475569)",agent:"Martin Soto",agentInit:"MS",
    desc1:"Amplio apartamento de tres dormitorios en el barrio de Providencia, la zona mas conectada y vibrante de Santiago. Diseno interior moderno con espacios abiertos, cocina americana totalmente equipada y balcon con vista despejada hacia la cordillera de los Andes.",
    desc2:"Edificio de reciente construccion con piscina en azotea, sala de eventos, bicicletero y estacionamiento. Excelente conectividad: a una cuadra del metro y rodeado de parques, comercio y vida cultural.",
    features:["Tres dormitorios amplios","Balcon con vista a la cordillera","Cocina americana equipada","Piscina en azotea","Sala de eventos","Bicicletero","Estacionamiento","Bodega"]},
  3:{title:"Piso obra nueva",loc:"Madrid, Espana",price:"285.000 EUR",beds:2,baths:2,m2:88,tag:"nuevo",
    gradient:"linear-gradient(135deg,#0f172a,#1e40af)",agent:"Elena Navarro",agentInit:"EN",
    desc1:"Flamante piso de obra nueva en una de las promociones mas destacadas de Madrid. Dos habitaciones con armarios empotrados, dos banos completos con griferia de diseno y un amplio salon comedor con salida a terraza privada. Cocina independiente totalmente amueblada.",
    desc2:"La promocion cuenta con zonas comunes de primer nivel: piscina, jardin comunitario, sala polivalente y garaje con plaza incluida en el precio. Certificacion energetica A. Situado en una zona con excelentes comunicaciones y todos los servicios a pie de calle.",
    features:["Obra nueva, a estrenar","Terraza privada","Garaje incluido","Certificacion energetica A","Armarios empotrados","Piscina comunitaria","Jardin comunitario","Videoportero"]},
  4:{title:"Departamento Palermo",loc:"Buenos Aires, Argentina",price:"USD 145.000",beds:2,baths:1,m2:68,tag:"",
    gradient:"linear-gradient(135deg,#1e293b,#334155)",agent:"Alejandra Rios",agentInit:"AR",
    desc1:"Departamento luminoso y funcional en Palermo Soho, el barrio mas buscado de Buenos Aires. Dos ambientes amplios con pisos de madera natural, cocina integrada al living y bano completo con terminaciones modernas. Orientacion norte que garantiza luz durante todo el dia.",
    desc2:"Edificio con laundry, sum y terraza con parrilla. La ubicacion no podria ser mejor: rodeado de las mejores propuestas gastronomicas, boutiques de diseno y espacios verdes. A tres cuadras de la estacion de subte Plaza Italia.",
    features:["Pisos de madera natural","Orientacion norte","Cocina integrada","Laundry en edificio","Terraza con parrilla","Sum para eventos","Luminosidad excepcional","Excelente ubicacion"]},
  5:{title:"Estudio Chapinero",loc:"Bogota, Colombia",price:"$380.000.000 COP",beds:1,baths:1,m2:42,tag:"",
    gradient:"linear-gradient(135deg,#0c4a6e,#2563eb)",agent:"Martin Soto",agentInit:"MS",
    desc1:"Estudio moderno y eficiente en Chapinero, el epicentro cultural y universitario de Bogota. Diseno inteligente que maximiza cada metro cuadrado con zona de descanso, area social, cocina tipo barra y bano con acabados contemporaneos. Ideal para profesionales jovenes.",
    desc2:"Edificio nuevo con zonas comunes que incluyen coworking, gimnasio, salon social y terraza con vista panoramica a los cerros orientales. Ubicacion estrategica cerca de centros comerciales, universidades y la cicloruta principal.",
    features:["Diseno optimizado","Cocina tipo barra","Zona de coworking","Gimnasio","Terraza panoramica","Salon social","Cerca de universidades","Cicloruta cercana"]},
  6:{title:"Atico Eixample",loc:"Barcelona, Espana",price:"520.000 EUR",beds:3,baths:2,m2:120,tag:"rebajado",
    gradient:"linear-gradient(135deg,#1e3a5f,#0f172a)",agent:"Elena Navarro",agentInit:"EN",
    desc1:"Magnifico atico en el corazon del Eixample barcelones con terraza privada de 40m2 y vistas despejadas a la ciudad. Tres habitaciones, dos banos completos, amplio salon con techos altos y suelos hidraulicos originales restaurados. Cocina de diseno con isla central.",
    desc2:"El edificio, de estilo modernista completamente rehabilitado, combina el encanto arquitectonico clasico con instalaciones contemporaneas. Ascensor, trastero y plaza de parking opcional. A escasos minutos del Passeig de Gracia y la Sagrada Familia.",
    features:["Terraza privada 40m2","Techos altos 3.2m","Suelos hidraulicos originales","Cocina con isla central","Edificio modernista rehabilitado","Ascensor renovado","Trastero incluido","Parking opcional"]},
  7:{title:"Penthouse Condesa",loc:"CDMX, Mexico",price:"$8,200,000 MXN",beds:3,baths:2,m2:135,tag:"",
    gradient:"linear-gradient(135deg,#0f172a,#2563eb)",agent:"Alejandra Rios",agentInit:"AR",
    desc1:"Impresionante penthouse en la colonia Condesa con roof garden privado y vista panoramica a la Ciudad de Mexico. Tres recamaras con vestidor, dos banos completos con tina y regadera, cocina gourmet con isla y amplia estancia con doble altura y chimenea.",
    desc2:"Acabados premium en cada detalle: pisos de marmol, canceleria de aluminio europeo, iluminacion led arquitectonica y sistema de domotica integrado. El edificio boutique cuenta con solo 6 unidades, lobby privado y dos cajones de estacionamiento.",
    features:["Roof garden privado","Doble altura en estancia","Cocina gourmet con isla","Sistema de domotica","Pisos de marmol","Chimenea","Dos estacionamientos","Edificio boutique"]},
  8:{title:"Apartamento Las Condes",loc:"Santiago, Chile",price:"125.000.000 CLP",beds:2,baths:1,m2:65,tag:"nuevo",
    gradient:"linear-gradient(135deg,#334155,#2563eb)",agent:"Martin Soto",agentInit:"MS",
    desc1:"Moderno apartamento de dos dormitorios en Las Condes, una de las comunas con mejor calidad de vida de Santiago. Diseno funcional con living-comedor integrado, cocina equipada con cubierta de cuarzo y bano con mampara de vidrio templado.",
    desc2:"Edificio recien entregado con piscina, gimnasio, quincho y salon multiuso. Ubicacion privilegiada a pasos del metro Tobalaba, centros comerciales y el circuito financiero de Santiago. Ideal como primera vivienda o inversion.",
    features:["Recien entregado","Cubierta de cuarzo","Piscina y gimnasio","Quincho comunitario","Cerca del metro","Zona financiera","Ideal inversion","Salon multiuso"]}
};

const id=new URLSearchParams(window.location.search).get('id')||'1';
const p=properties[id]||properties[1];
document.title=p.title+' — NovaCasa';
document.getElementById('propHero').style.background=p.gradient;
if(p.tag){
  const badges=document.createElement('div');badges.className='prop-badges';
  const b=document.createElement('span');
  b.className='badge '+(p.tag==='nuevo'?'badge-new':'badge-sale');
  b.textContent=p.tag==='nuevo'?'Nuevo':'Rebajado';
  badges.appendChild(b);
  document.getElementById('propHero').appendChild(badges);
}
document.getElementById('propTitle').textContent=p.title;
document.getElementById('propLoc').textContent=p.loc;
document.getElementById('propPrice').textContent=p.price;
document.getElementById('propMeta').innerHTML=`
  <div class="prop-meta-item"><div class="val">${p.beds}</div><div class="lbl">Habitaciones</div></div>
  <div class="prop-meta-item"><div class="val">${p.baths}</div><div class="lbl">Banos</div></div>
  <div class="prop-meta-item"><div class="val">${p.m2}</div><div class="lbl">Metros cuadrados</div></div>
`;
let featuresHtml=p.features.map(f=>`<div class="feature"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>${f}</div>`).join('');
document.getElementById('propDesc').innerHTML=`
  <h2>Descripcion</h2>
  <p>${p.desc1}</p>
  <p>${p.desc2}</p>
  <h2 style="margin-top:32px">Caracteristicas</h2>
  <div class="features">${featuresHtml}</div>
  <div class="floor-plan">Plano de planta — disponible bajo solicitud</div>
`;
document.getElementById('propAgent').innerHTML=`
  <div class="agent-avatar">${p.agentInit}</div>
  <div class="agent-info"><div class="name">${p.agent}</div><div class="role">Agente inmobiliario</div></div>
`;
const obs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})
},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
</body>
</html>
