<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedad — Fincas del Sur</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brown:#3c1518;--cream:#fdf6e3;--terra:#c1440e;--dark:#2d2017;--border:#d4c5a9;--card-bg:#fff8ee}
body{font-family:'Source Sans 3',sans-serif;color:var(--dark);background:var(--cream);line-height:1.6}
h1,h2,h3,h4{font-family:'Merriweather',serif;color:var(--brown)}
a{color:var(--terra);text-decoration:none;transition:all .3s cubic-bezier(.16,1,.3,1)}
a:hover{color:var(--brown)}
.container{max-width:1100px;margin:0 auto;padding:0 20px}

nav{background:var(--brown);color:var(--cream);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:10px 20px}
.logo{font-family:'Merriweather',serif;font-size:1.4rem;font-weight:900;color:var(--cream)}
.logo span{color:#e8a87c}
.nav-links{display:flex;gap:20px;align-items:center}
.nav-links a{color:var(--cream);font-weight:600;font-size:.95rem;opacity:.9}
.nav-links a:hover{opacity:1;color:#e8a87c}

.back-bar{background:var(--brown);padding:8px 0;border-top:1px solid rgba(255,255,255,.1)}
.back-bar a{color:#e8a87c;font-size:.9rem;display:flex;align-items:center;gap:6px;max-width:1100px;margin:0 auto;padding:0 20px}
.back-bar svg{width:16px;height:16px;fill:#e8a87c}

.prop-hero{min-height:320px;display:flex;align-items:center;justify-content:center;position:relative}
.prop-hero .placeholder-icon{opacity:.3}
.prop-hero .placeholder-icon svg{width:80px;height:80px}
.badge{position:absolute;top:20px;left:20px;padding:5px 14px;border-radius:4px;font-size:.85rem;font-weight:700;text-transform:uppercase;color:#fff}
.badge-nuevo{background:#2d8a4e}.badge-rebajado{background:#c0392b}.badge-favorito{background:#d4a017}

.prop-header{padding:25px 0;border-bottom:1px solid var(--border)}
.prop-header .type-label{font-size:.8rem;text-transform:uppercase;color:var(--terra);font-weight:700;letter-spacing:.5px}
.prop-header h1{font-size:1.8rem;margin:4px 0 8px}
.prop-header .location{font-size:1rem;color:#888;display:flex;align-items:center;gap:6px}
.prop-header .location svg{width:18px;height:18px;fill:#888}
.price-row{display:flex;align-items:center;gap:20px;margin-top:12px}
.price-big{font-family:'Merriweather',serif;font-size:2rem;font-weight:900;color:var(--terra)}

.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:30px;padding:30px 0}
.specs-bar{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.specs-bar .spec-item{display:flex;align-items:center;gap:6px;font-size:1rem}
.specs-bar .spec-item svg{width:20px;height:20px;fill:var(--terra)}
.specs-bar .spec-item strong{font-weight:700}

.description h2{font-size:1.2rem;margin-bottom:12px}
.description p{margin-bottom:14px;font-size:.95rem;color:#444;line-height:1.7}

.features{margin:25px 0}
.features h2{font-size:1.2rem;margin-bottom:14px}
.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.feat-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.9rem}
.feat-item svg{width:18px;height:18px;fill:var(--terra);flex-shrink:0}

.neighborhood{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:20px;margin:20px 0}
.neighborhood h3{font-size:1.1rem;margin-bottom:8px}
.neighborhood p{font-size:.9rem;color:#555}

.map-placeholder,.energy-placeholder{background:#e8dcc8;border:2px dashed var(--border);border-radius:6px;height:180px;display:flex;align-items:center;justify-content:center;color:#999;font-size:.9rem;margin:15px 0}

.sidebar-detail{display:flex;flex-direction:column;gap:16px}
.agent-card{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:20px;text-align:center}
.agent-avatar{width:64px;height:64px;border-radius:50%;background:var(--brown);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:'Merriweather',serif;font-weight:700;font-size:1.2rem;margin:0 auto 10px}
.agent-card h3{font-size:1rem;margin-bottom:2px}
.agent-card .role{font-size:.85rem;color:#888;margin-bottom:10px}
.agent-card .phone{font-family:'Merriweather',serif;font-size:1.1rem;color:var(--terra);font-weight:700}
.contact-form{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:20px}
.contact-form h3{font-size:1rem;margin-bottom:12px}
.contact-form input,.contact-form textarea{width:100%;padding:8px 10px;border:2px solid var(--border);border-radius:4px;margin-bottom:8px;font-family:'Source Sans 3',sans-serif;font-size:.9rem}
.contact-form textarea{height:80px;resize:vertical}
.btn-contact{width:100%;background:var(--terra);color:#fff;border:none;padding:10px;border-radius:4px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;transition:all .3s cubic-bezier(.16,1,.3,1)}
.btn-contact:hover{background:var(--brown)}

.similar{padding:30px 0;border-top:1px solid var(--border);margin-top:20px}
.similar h2{font-size:1.3rem;margin-bottom:16px}
.similar-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sim-card{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:all .3s cubic-bezier(.16,1,.3,1)}
.sim-card:hover{box-shadow:0 4px 15px rgba(60,21,24,.12);transform:translateY(-2px)}
.sim-img{height:120px;display:flex;align-items:center;justify-content:center}
.sim-img svg{width:36px;height:36px;opacity:.3}
.sim-body{padding:12px}
.sim-body h4{font-size:.95rem;margin-bottom:2px}
.sim-body .loc{font-size:.8rem;color:#888;margin-bottom:6px}
.sim-body .price{font-family:'Merriweather',serif;font-size:1.05rem;color:var(--terra);font-weight:700}

footer{background:#1a0a0c;color:var(--cream);padding:20px;text-align:center;font-size:.8rem;margin-top:30px}
footer a{color:#e8a87c}

.reveal{opacity:0;transform:translateY(20px);transition:all .6s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .detail-grid{grid-template-columns:1fr}
  .similar-grid{grid-template-columns:1fr}
  .features-grid{grid-template-columns:1fr}
  .prop-header h1{font-size:1.4rem}
  .price-big{font-size:1.5rem}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">Fincas <span>del Sur</span></a>
    <div class="nav-links">
      <a href="index.html">Propiedades</a>
      <a href="vender.html">Vender</a>
      <a href="nosotros.html">Nosotros</a>
    </div>
  </div>
</nav>
<div class="back-bar">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Volver al listado</a>
</div>

<div id="propContent"></div>

<footer>
  &copy; 2024 Fincas del Sur. Todos los derechos reservados. | Sitio creado por <a href="../">CLICKICLICK</a>

<script>
const properties = [
  {id:1,title:"Casa familiar con jardin",type:"Casa",location:"Sevilla, Espana",country:"espana",beds:4,baths:3,area:210,price:"345.000 EUR",gradient:"linear-gradient(135deg,#a8763e,#d4a574)",badge:null,

   features:["Jardin privado 80 m2","Garaje doble","Piscina comunitaria","Cocina reformada 2021","Aire acondicionado central","Suelos de marmol","Armarios empotrados","Trastero","Orientacion sur","Certificado energetico B"],
   neighborhood:"Zona residencial tranquila en Nervion, con colegios, supermercados, parques y parada de metro a 5 minutos. Excelente comunicacion con el centro y la circunvalacion.",agent:"Maria Lopez",agentRole:"Directora comercial",agentInit:"ML"},
  {id:2,title:"Departamento Recoleta",type:"Departamento",location:"Buenos Aires, Argentina",country:"argentina",beds:3,baths:2,area:110,price:"USD 195.000",gradient:"linear-gradient(135deg,#5a7a8a,#8ab4c4)",badge:"favorito",
   desc:["Elegante departamento en el corazon de Recoleta, uno de los barrios mas exclusivos de Buenos Aires. Con tres dormitorios luminosos y dos banos completos, esta propiedad combina la arquitectura clasica portena con las comodidades modernas.","El living-comedor es amplio y luminoso, con balcon corrido que ofrece vistas al arbolado del barrio. La cocina es independiente y cuenta con lavadero. Los pisos de roble original han sido restaurados conservando su encanto historico.","El edificio cuenta con porteria 24 horas, sala de usos multiples y terraza comun con parrilla. Ubicacion privilegiada a pasos del Cementerio de la Recoleta, la Biblioteca Nacional y los mejores restaurantes de la ciudad."],
   features:["Balcon corrido","Porteria 24 hs","Pisos de roble","Lavadero independiente","Terraza con parrilla","Baulera","Ascensor","Luminoso","Edificio clasico","SUM"],
   neighborhood:"Recoleta es el barrio mas elegante de Buenos Aires, con amplias avenidas arboladas, museos de primer nivel, gastronomia de excelencia y una vida cultural inigualable.",agent:"Carlos Garcia",agentRole:"Agente senior",agentInit:"CG"},
  {id:3,title:"Chalet pareado",type:"Chalet",location:"Malaga, Espana",country:"espana",beds:3,baths:2,area:145,price:"265.000 EUR",gradient:"linear-gradient(135deg,#c1440e,#e87040)",badge:"rebajado",
   desc:["Fantastico chalet pareado en urbanizacion residencial de Malaga, a tan solo 15 minutos de las playas de la Costa del Sol. Tres dormitorios amplios, dos banos completos y un salon con chimenea que invita a disfrutar los meses de invierno.","La planta baja cuenta con un salon-comedor diafano de 35 metros cuadrados con acceso directo al jardin y la terraza. La cocina es americana, totalmente equipada, y hay un aseo de cortesia. En la planta superior se distribuyen los tres dormitorios.","Urbanizacion cerrada con piscina comunitaria, zonas verdes y area de juegos infantiles. Plaza de garaje incluida. Excelente oportunidad con precio rebajado por traslado del propietario."],
   features:["Chimenea","Jardin y terraza","Piscina comunitaria","Cocina americana","Garaje","Urbanizacion cerrada","Zonas infantiles","Armarios empotrados","Preinstalacion A/C","Precio rebajado"],
   neighborhood:"Zona residencial de Teatinos, en plena expansion, con universidad, centro comercial, colegios y acceso rapido a la autovia de la Costa del Sol.",agent:"Ana Ruiz",agentRole:"Agente inmobiliaria",agentInit:"AR"},
  {id:4,title:"Casa en Vina del Mar",type:"Casa",location:"Chile",country:"chile",beds:4,baths:3,area:180,price:"210.000.000 CLP",gradient:"linear-gradient(135deg,#2d6a4f,#52b788)",badge:null,
   desc:["Hermosa casa en sector residencial de Vina del Mar con vista parcial al mar. Cuatro dormitorios, tres banos y amplios espacios de estar hacen de esta propiedad una opcion ideal para familias que buscan calidad de vida junto al Pacifico.","La casa cuenta con un living-comedor con ventanales de piso a techo que inundan los espacios de luz natural. La cocina es moderna y equipada. El dormitorio principal tiene bano en suite y walk-in closet.","El terreno de 350 metros cuadrados incluye estacionamiento para dos vehiculos, quincho con asador y un jardin con riego automatico. Ubicacion tranquila pero cercana a comercio, colegios y transporte."],
   features:["Vista parcial al mar","Quincho con asador","Estacionamiento doble","Walk-in closet","Ventanales piso-techo","Riego automatico","Terreno 350 m2","Bano en suite","Cocina equipada","Calefaccion central"],

  {id:5,title:"Piso centrico reformado",type:"Piso",location:"Valencia, Espana",country:"espana",beds:3,baths:1,area:95,price:"198.000 EUR",gradient:"linear-gradient(135deg,#e76f51,#f4a261)",badge:null,
   desc:["Precioso piso totalmente reformado en el centro historico de Valencia, a escasos metros de la Plaza de la Virgen. Tres habitaciones, un bano completo y una distribucion optimizada que aprovecha cada metro cuadrado.","La reforma integral realizada en 2022 incluye instalaciones nuevas de electricidad y fontaneria, ventanas de doble acristalamiento con aislamiento acustico, y suelos de gres porcelanico de primera calidad.","Edificio historico con fachada restaurada y ascensor. Zona peatonal con todos los servicios a pie de calle: mercado, tiendas, restaurantes y la mejor oferta cultural de la ciudad."],
   features:["Reforma integral 2022","Centro historico","Ascensor","Doble acristalamiento","Suelos porcelanicos","Cocina equipada","Instalaciones nuevas","Zona peatonal","Luminoso","Calefaccion"],
   neighborhood:"Pleno centro de Valencia, en la Ciutat Vella, rodeado de historia, cultura y gastronomia. Metro, bus y servicios de bicicleta publica a pocos pasos.",agent:"Carlos Garcia",agentRole:"Agente senior",agentInit:"CG"},
  {id:6,title:"Casa colonial Cartagena",type:"Casa",location:"Colombia",country:"colombia",beds:5,baths:4,area:280,price:"$1.200.000.000 COP",gradient:"linear-gradient(135deg,#6a0572,#ab83a1)",badge:"favorito",
   desc:["Espectacular casa colonial completamente restaurada en el centro amurallado de Cartagena de Indias. Con cinco habitaciones y cuatro banos, esta joya arquitectonica combina la historia de cuatro siglos con las comodidades del siglo XXI.","Los techos de doble altura con vigas de madera originales, los pisos de barro cocido y el patio interior con fuente crean un ambiente unico e irrepetible. Cada habitacion ha sido intervenida con sensibilidad y materiales de primera calidad.","La terraza en la azotea ofrece vistas panoramicas a las cupulas y tejados del centro historico. Ideal como residencia principal, casa vacacional o proyecto de hospedaje boutique en una de las ciudades mas turisticas del Caribe."],
   features:["Centro amurallado","Patio interior con fuente","Terraza panoramica","Techos doble altura","Vigas originales","Pisos barro cocido","Restauracion completa","5 habitaciones","Potencial hotelero","Patrimonio historico"],

  {id:7,title:"Adosado con terraza",type:"Adosado",location:"Alicante, Espana",country:"espana",beds:3,baths:2,area:130,price:"225.000 EUR",gradient:"linear-gradient(135deg,#264653,#2a9d8f)",badge:"nuevo",

   features:["Terraza solarium 25 m2","Obra nueva","Cocina abierta","Piscina comunitaria","Garaje y trastero","Patio trasero","Zona deportiva","Armarios empotrados","Preinstalacion domotica","Certificado energetico A"],

  {id:8,title:"Casa estilo campo",type:"Casa",location:"Mendoza, Argentina",country:"argentina",beds:4,baths:2,area:200,price:"USD 165.000",gradient:"linear-gradient(135deg,#606c38,#a3b18a)",badge:null,
   desc:["Encantadora casa de estilo campestre en las afueras de la ciudad de Mendoza, con vistas a la cordillera de los Andes. Cuatro dormitorios, dos banos y amplios espacios de estar en un terreno de 800 metros cuadrados.","La galeria perimetral es el corazon de la casa, perfecta para disfrutar de los atardeceres mendocinos con una copa de Malbec. La cocina es espaciosa con mesada de granito y horno de lena en el quincho exterior.","Rodeada de fincas viticolas y a 20 minutos del centro de Mendoza. Pileta, quincho con asador, huerta organica y estacionamiento para tres vehiculos. Una propiedad para quienes buscan tranquilidad sin renunciar a la ciudad."],

const id = parseInt(new URLSearchParams(window.location.search).get('id')) || 1;
const prop = properties.find(p=>p.id===id) || properties[0];

const badgeHTML = b => {
  if(!b) return '';
  if(b==='nuevo') return '<div class="badge badge-nuevo">Nuevo</div>';
  if(b==='rebajado') return '<div class="badge badge-rebajado">Rebajado</div>';
  if(b==='favorito') return '<div class="badge badge-favorito">Favorito</div>';
  return '';
};

const similar = properties.filter(p=>p.id!==prop.id).slice(0,2);

          <div class="loc">${s.location}</div>
          <div class="price">${s.price}</div>
        </div>
      </a>`).join('')}
    </div>
  </div>
</div>`;

const observer = new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting) e.target.classList.add('visible');});
},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
</script>
</body>
</html>
